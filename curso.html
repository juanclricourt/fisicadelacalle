<style>
:root{--asfalto:#16181c;--asfalto2:#1f2228;--linea:#2c3038;--amarillo:#ffc72c;--texto:#eef0f3;--suave:#a3a9b4}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--asfalto);color:var(--texto);font-family:Inter,system-ui,sans-serif;line-height:1.55;min-height:100vh}
.pronto-fondo{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;z-index:200}
.pronto-caja{position:relative;width:min(440px,100%);background:var(--asfalto2);border:1px solid var(--linea);border-radius:20px;padding:30px 26px 24px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden}
.pronto-caja::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:repeating-linear-gradient(90deg,var(--amarillo) 0 30px,transparent 30px 50px)}
.pronto-x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:1px solid var(--linea);background:transparent;color:var(--suave);font-size:1rem;cursor:pointer}
.pronto-ico{width:64px;height:64px;border-radius:18px;margin:4px auto 14px;background:var(--amarillo);color:#111;display:flex;align-items:center;justify-content:center}
.pronto-ico svg{width:32px;height:32px}
.pronto-eti{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:2px;color:var(--amarillo);border:1px solid rgba(255,199,44,.4);border-radius:99px;padding:4px 12px;margin-bottom:10px}
.pronto-caja h3{font-family:"Archivo Black",sans-serif;font-weight:800;font-size:1.45rem;line-height:1.15;margin-bottom:8px}
.pronto-caja p{color:var(--suave);font-size:.95rem;margin-bottom:16px}
.pronto-lista{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.pronto-lista span{font-size:.8rem;background:var(--asfalto);border:1px solid var(--linea);border-radius:99px;padding:5px 10px;color:var(--texto)}
.pronto-av{font-size:.82rem;color:var(--suave);margin-bottom:8px}
.pronto-redes{display:flex;justify-content:center;gap:8px;margin-bottom:4px}
.pronto-redes a{width:46px;height:46px;border-radius:12px;background:var(--asfalto);border:1px solid var(--linea);display:flex;align-items:center;justify-content:center}
.pronto-redes .ico{width:22px;height:22px}
.pronto-ver{display:block;color:var(--amarillo);font-weight:700;font-size:.9rem;text-decoration:none}

.pronto-volver{display:inline-block;margin-top:6px;color:var(--amarillo);font-weight:700;font-size:.9rem;text-decoration:none}
.pronto-redes{margin-bottom:16px}
</style>
